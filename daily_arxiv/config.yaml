arxiv:
  categories:  # 文章类型
    - cs.CV
    - cs.CL
    - cs.RO
    - cs.AI
    - cs.LG

  # 必须出现的词语（论文标题或摘要中须包含至少一个才进入后续过滤）
  # 这是第一层"粗筛"，用于限定大方向
  # 留空或注释掉则跳过此层过滤
  required_terms:
    - "LLM"
    - "large language model"
    - "autonomous driving"
    - "feedback"

  # 研究方向关键词过滤（第二层"细筛"）
  # 论文须同时满足：包含至少一个 required_term + 包含至少一个 keyword
  # 不区分大小写匹配
  # 留空或注释掉则不过滤（仅使用 required_terms 过滤）
  keywords:
    # LLM 推理方向
    - "LLM reasoning"
    - "reasoning"
    - "inference"
    - "step-by-step"
    - "logical reasoning"
    - "mathematical reasoning"
    - "commonsense reasoning"
    - "multi-step reasoning"
    - "self-consistency"
    - "retrieval-augmented generation"
    - "RLHF"
    - "RLVR"
    - "RL"
    - "reinforcement learning from human feedback"
    - "reward model"
    - "tool use"
    - "planning"
    - "code generation"
    - "self-reflection"

    # 自动驾驶 3D 方向
    - "autonomous driving"
    - "3D object detection"
    - "3D perception"
    - "3D point cloud"
    - "LiDAR"
    - "BEV"
    - "bird's eye view"
    - "bird's-eye-view"
    - "depth estimation"
    - "monocular 3D"
    - "multi-view 3D"
    - "3D tracking"
    - "trajectory prediction"
    - "end-to-end driving"
    - "sensor fusion"
    - "camera-LiDAR fusion"
    - "3D semantic segmentation"
    - "3D scene understanding"
    - "surround view"
    - "ego vehicle"

    # 4D 重建方向
    - "4D reconstruction"
    - "dynamic scene reconstruction"
    - "4D scene"
    - "4D Gaussian"
    - "3D Gaussian splatting"
    - "Gaussian splatting"
    - "4D generation"
    - "scene flow"
    - "non-rigid reconstruction"
    - "dynamic point cloud"
    - "4D point cloud"
    - "novel view synthesis"
    - "3D reconstruction"
    - "multi-view reconstruction"

llm:
  model_name: 'deepseek-chat'  # 使用的LLM模型
